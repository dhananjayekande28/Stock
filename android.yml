name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract uploaded project ZIP if present
        run: |
          if [ -f AI-Trade-Pro-Android-Project.zip ]; then
            mkdir -p /tmp/aitrade-src
            unzip -q AI-Trade-Pro-Android-Project.zip -d /tmp/aitrade-src
            cp -a /tmp/aitrade-src/AI-Trade-Pro/. .
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-Pro-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
