
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trade Pro</title>
<style>
body {
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}
header {
  background:#172b46;
  padding:20px;
  text-align:center;
}
h1 {color:#00e5a0;margin:0}
main {padding:12px}
.panel {
  background:#1c2c43;
  padding:14px;
  margin-bottom:15px;
  border-radius:12px;
}
h2 {color:#00e5a0;font-size:18px}
.widget {
  width:100%;
  min-height:500px;
}
.widget iframe {max-width:100%}
footer {
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>
<body>

<header>
<h1>AI TRADE PRO</h1>
<p>NSE + BSE Stock Dashboard</p>
</header>

<main>

<div class="panel">
<h2>Live / Available Market Quotes</h2>
<div class="tradingview-widget-container widget">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js"
async>
{
  "width":"100%",
  "height":"500",
  "symbolsGroups":[
    {
      "name":"NSE Stocks",
      "symbols":[
        {"name":"NSE:RELIANCE","displayName":"Reliance"},
        {"name":"NSE:TCS","displayName":"TCS"},
        {"name":"NSE:INFY","displayName":"Infosys"},
        {"name":"NSE:HDFCBANK","displayName":"HDFC Bank"},
        {"name":"NSE:ICICIBANK","displayName":"ICICI Bank"},
        {"name":"NSE:SBIN","displayName":"SBI"},
        {"name":"NSE:ITC","displayName":"ITC"}
      ]
    },
    {
      "name":"Indices",
      "symbols":[
        {"name":"NSE:NIFTY","displayName":"Nifty 50"},
        {"name":"NSE:BANKNIFTY","displayName":"Bank Nifty"},
        {"name":"BSE:SENSEX","displayName":"Sensex"}
      ]
    }
  ],
  "showSymbolLogo":true,
  "isTransparent":false,
  "colorTheme":"dark",
  "locale":"en"
}
</script>
</div>
</div>

<div class="panel">
<h2>NIFTY 50 Chart</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
async>
{
  "symbols":[["NIFTY 50","NSE:NIFTY|1D"]],
  "chartOnly":false,
  "width":"100%",
  "height":400,
  "locale":"en",
  "colorTheme":"dark",
  "isTransparent":false,
  "showVolume":true,
  "showMA":true,
  "hideDateRanges":false,
  "autosize":true
}
</script>
</div>
</div>

</main>

<footer>
AI Trade Pro | Free Market Dashboard
</footer>

</body>
</html>
