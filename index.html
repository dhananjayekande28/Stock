
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trade Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#087c59;text-align:center;padding:18px}
h1{margin:0}
.info{text-align:center;padding:12px;color:#cbd5e1}
button{background:#07966c;color:white;border:0;padding:12px 22px;border-radius:8px}
#status{text-align:center;color:#facc15;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:12px}
.card{background:#1e293b;padding:15px;border-radius:10px}
.price{font-size:25px;font-weight:bold;margin:10px 0}
.green{color:#4ade80}.red{color:#fb7185}
.small{font-size:12px;color:#cbd5e1;margin-top:7px}
.signal{font-size:17px;font-weight:bold;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{font-size:11px;text-align:center;padding:7px;border-bottom:1px solid #475569}
</style>
</head>
<body>
<header>
<h1>AI TRADE PRO</h1>
<div>Stock Market Analysis</div>
</header>

<div class="info">
NIFTY 50 | BANK NIFTY | SENSEX | NSE STOCKS
</div>

<div style="text-align:center">
<button onclick="loadData()">REFRESH DATA</button>
</div>

<div id="status">डेटा कनेक्शन की प्रतीक्षा...</div>
<div class="grid" id="dashboard"></div>

<script>
const stocks=[
["NIFTY 50","NIFTY"],
["BANK NIFTY","BANKNIFTY"],
["SENSEX","SENSEX"],
["RELIANCE","RELIANCE"],
["TCS","TCS"],
["INFOSYS","INFY"],
["HDFC BANK","HDFCBANK"],
["ICICI BANK","ICICIBANK"],
["SBI","SBIN"],
["ITC","ITC"],
["TATA MOTORS","TATAMOTORS"],
["L&T","LT"],
["BHARTI AIRTEL","BHARTIARTL"],
["AXIS BANK","AXISBANK"],
["KOTAK BANK","KOTAKBANK"]
];

const fmt=n=>Number(n).toLocaleString("en-IN",{
 minimumFractionDigits:2,
 maximumFractionDigits:2
});

function average(a){
 return a.reduce((s,v)=>s+v,0)/a.length;
}

function EMA(a,p){
 let k=2/(p+1),v=a[0],out=[];
 a.forEach(x=>{
  v=x*k+v*(1-k);
  out.push(v);
 });
 return out;
}

function RSI(a){
 if(a.length<15)return null;
 let gain=0,loss=0;
 for(let i=a.length-14;i<a.length;i++){
  let d=a[i]-a[i-1];
  if(d>0)gain+=d;
  else loss-=d;
 }
 return loss===0?100:100-100/(1+(gain/14)/(loss/14));
}

function MACD(a){
 if(a.length<35)return null;
 let e1=EMA(a,12),e2=EMA(a,26);
 let line=a.map((v,i)=>e1[i]-e2[i]);
 let sig=EMA(line,9);
 return {
  value:line.at(-1),
  signal:sig.at(-1),
  hist:line.at(-1)-sig.at(-1)
 };
}

function STOCH(a){
 if(a.length<14)return null;
 let x=a.slice(-14);
 let lo=Math.min(...x),hi=Math.max(...x);
 return hi===lo?50:100*(x.at(-1)-lo)/(hi-lo);
}

function BB(a){
 if(a.length<20)return null;
 let x=a.slice(-20),m=average(x);
 let sd=Math.sqrt(average(x.map(v=>(v-m)**2)));
 return {upper:m+2*sd,mid:m,lower:m-2*sd};
}

function aggregate(a,n){
 let out=[];
 for(let i=n-1;i<a.length;i+=n)out.push(a[i]);
 return out;
}

function calculate(a){
 return {
  rsi:RSI(a),
  macd:MACD(a),
  stoch:STOCH(a),
  bb:BB(a)
 };
}

function row(label,d){
 return `<tr>
 <td>${label}</td>
 <td>${d.rsi===null?"N/A":d.rsi.toFixed(2)}</td>
 <td>${d.macd?d.macd.hist.toFixed(2):"N/A"}</td>
 <td>${d.stoch===null?"N/A":d.stoch.toFixed(2)}</td>
 <td>${d.bb?fmt(d.bb.upper):"N/A"}</td>
 <td>${d.bb?fmt(d.bb.lower):"N/A"}</td>
 </tr>`;
}

function showCard(name,d){
 let cls=d.change>=0?"green":"red";
 return `<div class="card">
 <h3>${name}</h3>
 <div class="price">₹ ${fmt(d.price)}</div>
 <div class="${cls}">
 ${d.change>=0?"+":""}${fmt(d.change)}
 (${d.pct.toFixed(2)}%)
 </div>
 <div class="small">पिछला बंद: ₹ ${fmt(d.previousClose)}</div>
 <div class="small">स्रोत: ${d.source}</div>
 <div class="small">अपडेट: ${d.time}</div>
 <div class="signal">${d.signal||"WAIT"}</div>
 <table>
 <tr><th>Period</th><th>RSI</th><th>MACD</th>
 <th>Stoch</th><th>BB Upper</th><th>BB Lower</th></tr>
 ${row("Daily",d.daily)}
 ${row("Weekly",d.weekly)}
 ${row("Monthly",d.monthly)}
 </table>
 </div>`;
}

/*
डेटा कनेक्शन:
इस फंक्शन को तभी सक्रिय करें जब Moneycontrol
के अधिकृत डेटा API या अधिकृत डेटा प्रदाता
से सही JSON feed उपलब्ध हो।

अपेक्षित JSON:
{
 "symbol":"NIFTY",
 "price":25291.10,
 "previousClose":25144.30,
 "history":[100,101,102]
}
*/

async function getMoneycontrolData(symbol){
 throw new Error(
  "Moneycontrol का सत्यापित डेटा कनेक्शन अभी सेट नहीं है"
 );
}

function makeSignal(d,price){
 let score=0;
 if(d.rsi!==null)score+=d.rsi>50?1:-1;
 if(d.macd)score+=d.macd.hist>0?1:-1;
 if(d.stoch!==null)score+=d.stoch>50?1:-1;
 if(d.bb)score+=price>d.bb.mid?1:-1;
 return score>=2?"BUY SETUP":score<=-2?"SELL SETUP":"WAIT";
}

async function loadData(){
 const board=document.getElementById("dashboard");
 const status=document.getElementById("status");
 board.innerHTML="";
 status.textContent="डेटा स्रोत की जाँच हो रही है...";

 let good=0,failed=0;

 for(const [name,symbol] of stocks){
  try{
   const d=await getMoneycontrolData(symbol);
   if(!Number.isFinite(d.price)||
      !Number.isFinite(d.previousClose)||
      d.previousClose<=0||
      !Array.isArray(d.history)||
      d.history.length<35){
    throw Error("डेटा अधूरा है");
   }

   d.change=d.price-d.previousClose;
   d.pct=d.change/d.previousClose*100;

   d.daily=calculate(d.history);
   d.weekly=calculate(aggregate(d.history,5));
   d.monthly=calculate(aggregate(d.history,21));
   d.signal=makeSignal(d.daily,d.price);

   board.innerHTML+=showCard(name,d);
   good++;
  }catch(e){
   failed++;
   board.innerHTML+=`<div class="card">
   <h3>${name}</h3>
   <div class="red">डेटा उपलब्ध नहीं</div>
   <div class="small">${e.message}</div>
   </div>`;
  }
 }

 status.textContent=
 `सफल: ${good} | उपलब्ध नहीं: ${failed}`;
}

loadData();
</script>
</body>
</html>
