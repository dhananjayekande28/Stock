
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trade Pro</title>
<style>
body {
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}
header {
  background:#172b46;
  padding:20px;
  text-align:center;
}
h1 {color:#00e5a0;margin:0;}
.subtitle {color:#b8c7d9;margin-top:8px;}
.section {padding:15px;}
.panel {
  background:#1c2c43;
  padding:15px;
  border-radius:12px;
  margin:12px 0;
}
h2 {color:#00e5a0;font-size:18px;}
iframe {width:100%;border:0;}
.footer {text-align:center;color:#aaa;padding:20px;}
</style>
</head>
<body>

<header>
<h1>AI TRADE PRO</h1>
<div class="subtitle">NSE + BSE Market Dashboard</div>
</header>

<div class="section">

<div class="panel">
<h2>Live Share Prices</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
async>
{
"symbols": [
{"proName":"NSE:NIFTY","title":"NIFTY 50"},
{"proName":"NSE:BANKNIFTY","title":"BANK NIFTY"},
{"proName":"NSE:RELIANCE","title":"RELIANCE"},
{"proName":"NSE:TCS","title":"TCS"},
{"proName":"NSE:INFY","title":"INFOSYS"},
{"proName":"BSE:500325","title":"RELIANCE BSE"}
],
"showSymbolLogo":true,
"isTransparent":true,
"displayMode":"adaptive",
"colorTheme":"dark",
"locale":"en"
}
</script>
</div>
</div>

<div class="panel">
<h2>NIFTY 50 Chart</h2>
<div class="tradingview-widget-container">
<div id="chart"></div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
"width":"100%",
"height":400,
"symbol":"NSE:NIFTY",
"interval":"D",
"timezone":"Asia/Kolkata",
"theme":"dark",
"style":"1",
"locale":"en",
"enable_publishing":false,
"allow_symbol_change":true,
"container_id":"chart"
});
</script>
</div>
</div>

<div class="panel">
<h2>Market Status</h2>
<p>NSE / BSE Market Data</p>
<p>Market timings: 9:15 AM - 3:30 PM</p>
<p>Data availability depends on exchange permissions.</p>
</div>

</div>

<div class="footer">
AI Trade Pro | Market Analysis Dashboard
</div>

</body>
</html>
