
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trade Pro</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#087c59;padding:18px;text-align:center}
h1{margin:0}
button{background:#07966c;color:white;border:0;padding:12px 22px;border-radius:8px}
.center{text-align:center;padding:15px}
#status{text-align:center;color:#facc15;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:12px}
.card{background:#1e293b;padding:14px;border-radius:10px;overflow-wrap:anywhere}
.price{font-size:25px;font-weight:bold}
.green{color:#4ade80}.red{color:#fb7185}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{font-size:11px;text-align:center;padding:7px;border-bottom:1px solid #475569}
.small{font-size:12px;color:#cbd5e1;margin-top:7px}
.signal{font-weight:bold;margin-top:12px;font-size:17px}
</style>
</head>
<body>
<header>
<h1>AI TRADE PRO</h1>
<div>Stock Market Analysis Dashboard</div>
</header>
<div class="center">NIFTY • BANK NIFTY • SENSEX • NSE STOCKS</div>
<div class="center"><button onclick="loadAll()">REFRESH DATA</button></div>
<div id="status">डेटा लोड हो रहा है...</div>
<div class="grid" id="dashboard"></div>
<div class="center small">डेटा स्रोत: Yahoo Finance के उपलब्ध डेटा पर आधारित। आधिकारिक लाइव NSE/BSE फीड नहीं।</div>

<script>
const stocks=[
["NIFTY 50","^NSEI"],
["BANK NIFTY","^NSEBANK"],
["SENSEX","^BSESN"],
["RELIANCE","RELIANCE.NS"],
["TCS","TCS.NS"],
["INFOSYS","INFY.NS"],
["HDFC BANK","HDFCBANK.NS"],
["ICICI BANK","ICICIBANK.NS"],
["SBI","SBIN.NS"],
["ITC","ITC.NS"],
["TATA MOTORS","TATAMOTORS.NS"],
["L&T","LT.NS"],
["BHARTI AIRTEL","BHARTIARTL.NS"],
["AXIS BANK","AXISBANK.NS"],
["KOTAK BANK","KOTAKBANK.NS"]
];

const fmt=n=>Number(n).toLocaleString("en-IN",{
 minimumFractionDigits:2,maximumFractionDigits:2
});

function avg(a){return a.reduce((s,v)=>s+v,0)/a.length}

function ema(a,p){
 let k=2/(p+1),out=[],v=a[0];
 for(let x of a){v=x*k+v*(1-k);out.push(v)}
 return out;
}

function calcRSI(a,p=14){
 if(a.length<=p)return null;
 let gain=0,loss=0;
 for(let i=1;i<=p;i++){
  let d=a[i]-a[i-1];
  if(d>0)gain+=d;else loss-=d;
 }
 let ag=gain/p,al=loss/p;
 for(let i=p+1;i<a.length;i++){
  let d=a[i]-a[i-1];
  ag=(ag*(p-1)+Math.max(d,0))/p;
  al=(al*(p-1)+Math.max(-d,0))/p;
 }
 return al===0?100:100-100/(1+ag/al);
}

function calcMACD(a){
 if(a.length<35)return null;
 let e1=ema(a,12),e2=ema(a,26);
 let line=a.map((v,i)=>e1[i]-e2[i]);
 let sig=ema(line,9);
 return {line:line.at(-1),signal:sig.at(-1),
 hist:line.at(-1)-sig.at(-1)};
}

function calcStoch(a){
 if(a.length<14)return null;
 let x=a.slice(-14);
 let lo=Math.min(...x),hi=Math.max(...x);
 return hi===lo?50:100*(x.at(-1)-lo)/(hi-lo);
}

function calcBB(a){
 if(a.length<20)return null;
 let x=a.slice(-20),m=avg(x);
 let sd=Math.sqrt(avg(x.map(v=>(v-m)**2)));
 return {mid:m,upper:m+2*sd,lower:m-2*sd};
}

function sample(a,n){
 let out=[];
 for(let i=n-1;i<a.length;i+=n)out.push(a[i]);
 if(out.length===0 || out.at(-1)!==a.at(-1))out.push(a.at(-1));
 return out;
}

function getIndicators(a){
 return {
  rsi:calcRSI(a),
  macd:calcMACD(a),
  stoch:calcStoch(a),
  bb:calcBB(a)
 };
}

function getSignal(d,price){
 let score=0;
 if(d.rsi!==null)score+=d.rsi>50?1:-1;
 if(d.macd)score+=d.macd.hist>0?1:-1;
 if(d.stoch!==null)score+=d.stoch>50?1:-1;
 if(d.bb)score+=price>d.bb.mid?1:-1;
 return score>=2?"BUY SETUP":score<=-2?"SELL SETUP":"WAIT";
}

async function fetchStock(symbol){
 const url="https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/"+
 encodeURIComponent(symbol)+"?range=2y&interval=1d";

 const response=await fetch(url,{cache:"no-store"});
 if(!response.ok)throw Error("डेटा सर्वर से नहीं मिला");

 const json=await response.json();
 const r=json.chart?.result?.[0];
 if(!r)throw Error("शेयर का डेटा उपलब्ध नहीं");

 const meta=r.meta||{};
 const quote=r.indicators?.quote?.[0];
 if(!quote)throw Error("भाव उपलब्ध नहीं");

 const valid=(quote.close||[]).filter(
  x=>Number.isFinite(x)
 );
 if(valid.length<35)throw Error("पर्याप्त पुराना डेटा नहीं");

 const lastClose=valid.at(-1);
 const previousClose=valid.at(-2);

 const price=Number.isFinite(meta.regularMarketPrice)
  ?meta.regularMarketPrice:lastClose;

 const prev=Number.isFinite(meta.chartPreviousClose)
  ?meta.chartPreviousClose:
  Number.isFinite(meta.previousClose)
  ?meta.previousClose:previousClose;

 if(!Number.isFinite(price)||!Number.isFinite(prev)||prev===0)
  throw Error("भाव की पुष्टि नहीं हुई");

 const daily=getIndicators(valid);
 const weekly=getIndicators(sample(valid,5));
 const monthly=getIndicators(sample(valid,21));

 const timestamp=meta.regularMarketTime||
  r.timestamp?.at(-1);

 return {
  price,prev,
  change:price-prev,
  pct:(price-prev)/prev*100,
  daily,weekly,monthly,
  time:timestamp?
   new Date(timestamp*1000).toLocaleString("en-IN"):
   "समय उपलब्ध नहीं"
 };
}

function makeRow(label,d){
 return `<tr>
 <td>${label}</td>
 <td>${d.rsi===null?"N/A":d.rsi.toFixed(2)}</td>
 <td>${d.macd?d.macd.hist.toFixed(2):"N/A"}</td>
 <td>${d.stoch===null?"N/A":d.stoch.toFixed(2)}</td>
 <td>${d.bb?fmt(d.bb.upper):"N/A"}</td>
 <td>${d.bb?fmt(d.bb.lower):"N/A"}</td>
 </tr>`;
}

function makeCard(name,d){
 const cls=d.change>=0?"green":"red";
 return `<div class="card">
 <h3>${name}</h3>
 <div class="price">₹ ${fmt(d.price)}</div>
 <div class="${cls}">
 ${d.change>=0?"+":""}${fmt(d.change)}
 (${d.pct>=0?"+":""}${d.pct.toFixed(2)}%)
 </div>
 <div class="small">पिछला बंद: ₹ ${fmt(d.prev)}</div>
 <div class="small">डेटा समय: ${d.time}</div>
 <div class="signal">${getSignal(d.daily,d.price)}</div>
 <table>
 <tr><th>समय</th><th>RSI</th><th>MACD</th>
 <th>Stoch</th><th>BB Upper</th><th>BB Lower</th></tr>
 ${makeRow("Daily",d.daily)}
 ${makeRow("Weekly",d.weekly)}
 ${makeRow("Monthly",d.monthly)}
 </table>
 </div>`;
}

async function loadAll(){
 const board=document.getElementById("dashboard");
 const status=document.getElementById("status");
 board.innerHTML="";
 status.textContent="शेयरों का डेटा जाँचा जा रहा है...";

 let success=0,failed=0;

 for(const [name,symbol] of stocks){
  try{
   const data=await fetchStock(symbol);
   board.innerHTML+=makeCard(name,data);
   success++;
  }catch(e){
   failed++;
   board.innerHTML+=`<div class="card">
   <h3>${name}</h3>
   <div class="red">डेटा उपलब्ध नहीं</div>
   <div class="small">${e.message}</div>
   </div>`;
  }
 }

 status.textContent=
 `सफल: ${success} | असफल: ${failed} | जाँच: ${new Date().toLocaleTimeString("en-IN")}`;
}

loadAll();
</script>
</body>
</html>
