
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trade Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#087c59;padding:18px;text-align:center}
h1{margin:0;font-size:26px}
.info{text-align:center;padding:12px;color:#cbd5e1}
button{background:#07966c;color:white;border:0;padding:12px 22px;border-radius:8px;font-weight:bold}
#status{text-align:center;color:#facc15;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:12px}
.card{background:#1e293b;padding:15px;border-radius:10px;overflow-wrap:anywhere}
.price{font-size:26px;font-weight:bold;margin:10px 0}
.green{color:#4ade80}
.red{color:#fb7185}
.small{font-size:12px;color:#cbd5e1;margin-top:7px}
.signal{font-size:17px;font-weight:bold;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{font-size:11px;text-align:center;padding:7px;border-bottom:1px solid #475569}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:20px}
</style>
</head>
<body>

<header>
<h1>AI TRADE PRO</h1>
<div>Live / Delayed Intraday Market Dashboard</div>
</header>

<div class="info">
NIFTY 50 | BANK NIFTY | SENSEX | NSE STOCKS
</div>

<center>
<button onclick="loadAll()">REFRESH DATA</button>
</center>

<div id="status">डेटा लोड हो रहा है...</div>
<div class="grid" id="dashboard"></div>

<footer>
Source: Yahoo Finance Chart API<br>
डेटा में देरी संभव है। यह आधिकारिक NSE/BSE लाइव फीड नहीं है।
</footer>

<script>
const stocks=[
["NIFTY 50","^NSEI"],
["BANK NIFTY","^NSEBANK"],
["SENSEX","^BSESN"],
["RELIANCE","RELIANCE.NS"],
["TCS","TCS.NS"],
["INFOSYS","INFY.NS"],
["HDFC BANK","HDFCBANK.NS"],
["ICICI BANK","ICICIBANK.NS"],
["SBI","SBIN.NS"],
["ITC","ITC.NS"],
["TATA MOTORS","TATAMOTORS.NS"],
["L&T","LT.NS"],
["BHARTI AIRTEL","BHARTIARTL.NS"],
["AXIS BANK","AXISBANK.NS"],
["KOTAK BANK","KOTAKBANK.NS"]
];

const $=id=>document.getElementById(id);
let loading=false;

function fmt(n){
 return Number(n).toLocaleString("en-IN",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function average(a){
 return a.reduce((s,v)=>s+v,0)/a.length;
}

// Yahoo Finance API
async function yahooChart(symbol,range,interval){

 const hosts=[
  "query1.finance.yahoo.com",
  "query2.finance.yahoo.com"
 ];

 let lastError="डेटा उपलब्ध नहीं";

 for(const host of hosts){
  try{
   const target=
    "https://"+host+
    "/v8/finance/chart/"+
    encodeURIComponent(symbol)+
    "?range="+range+
    "&interval="+interval;

   const url="https://proxy.cors.dev/"+target;

   const response=await fetch(url,{
    cache:"no-store",
    credentials:"omit"
   });

   if(!response.ok){
    throw Error("Server error "+response.status);
   }

   const json=await response.json();
   const result=json.chart?.result?.[0];

   if(!result){
    throw Error(
     json.chart?.error?.description||
     "Yahoo डेटा उपलब्ध नहीं"
    );
   }

   return result;

  }catch(e){
   lastError=e.message;
  }
 }

 throw Error(lastError);
}

// Valid OHLC candles
function getCandles(result){

 const q=result.indicators?.quote?.[0];

 if(!q)throw Error("Historical data नहीं मिला");

 const candles=[];

 for(let i=0;i<(q.close||[]).length;i++){

  const close=q.close[i];
  const high=q.high?.[i];
  const low=q.low?.[i];

  if(
   Number.isFinite(close)&&
   Number.isFinite(high)&&
   Number.isFinite(low)
  ){
   candles.push({
    close:close,
    high:high,
    low:low
   });
  }
 }

 return candles;
}

// RSI
function calculateRSI(closes,period=14){

 if(closes.length<=period)return null;

 let gain=0,loss=0;

 for(let i=1;i<=period;i++){
  const d=closes[i]-closes[i-1];

  if(d>0)gain+=d;
  else loss-=d;
 }

 let avgGain=gain/period;
 let avgLoss=loss/period;

 for(let i=period+1;i<closes.length;i++){

  const d=closes[i]-closes[i-1];

  avgGain=(
   avgGain*(period-1)+Math.max(d,0)
  )/period;

  avgLoss=(
   avgLoss*(period-1)+Math.max(-d,0)
  )/period;
 }

 if(avgLoss===0)return 100;

 const rs=avgGain/avgLoss;

 return 100-(100/(1+rs));
}

// EMA
function EMA(values,period){

 const k=2/(period+1);
 let value=values[0];
 const output=[];

 for(const x of values){
  value=x*k+value*(1-k);
  output.push(value);
 }

 return output;
}

// MACD
function calculateMACD(closes){

 if(closes.length<35)return null;

 const fast=EMA(closes,12);
 const slow=EMA(closes,26);

 const line=closes.map(
  (x,i)=>fast[i]-slow[i]
 );

 const signal=EMA(line,9);

 return {
  line:line.at(-1),
  signal:signal.at(-1),
  histogram:line.at(-1)-signal.at(-1)
 };
}

// Stochastic
function calculateStochastic(candles){

 if(candles.length<14)return null;

 const last=candles.slice(-14);

 const highest=Math.max(...last.map(x=>x.high));
 const lowest=Math.min(...last.map(x=>x.low));
 const close=last.at(-1).close;

 if(highest===lowest)return 50;

 return 100*(close-lowest)/(highest-lowest);
}

// Bollinger Bands
function calculateBB(closes){

 if(closes.length<20)return null;

 const last=closes.slice(-20);
 const middle=average(last);

 const variance=average(
  last.map(x=>(x-middle)**2)
 );

 const sd=Math.sqrt(variance);

 return {
  middle:middle,
  upper:middle+2*sd,
  lower:middle-2*sd
 };
}

// Indicators
function calculateIndicators(candles){

 const closes=candles.map(x=>x.close);

 return {
  rsi:calculateRSI(closes),
  macd:calculateMACD(closes),
  stochastic:calculateStochastic(candles),
  bb:calculateBB(closes),
  lastClose:closes.at(-1)
 };
}

// Basic technical setup
function signal(d){

 let score=0;

 if(d.rsi!==null)
  score+=d.rsi>50?1:-1;

 if(d.macd)
  score+=d.macd.histogram>0?1:-1;

 if(d.stochastic!==null)
  score+=d.stochastic>50?1:-1;

 if(d.bb){
  score+=d.lastClose>d.bb.middle?1:-1;
 }

 if(score>=2)return "BUY SETUP";
 if(score<=-2)return "SELL SETUP";

 return "WAIT";
}

// Main stock data
async function fetchStock(symbol){

 const [
  quoteResult,
  dailyResult,
  weeklyResult,
  monthlyResult
 ]=await Promise.all([

  // Intraday quote: 1 minute
  yahooChart(symbol,"1d","1m"),

  // Daily indicators
  yahooChart(symbol,"2y","1d"),

  // Weekly indicators
  yahooChart(symbol,"5y","1wk"),

  // Monthly indicators
  yahooChart(symbol,"10y","1mo")
 ]);

 const meta=quoteResult.meta||{};

 // Current / latest traded price
 const price=meta.regularMarketPrice;

 // Previous trading session close
 const previousClose=meta.chartPreviousClose;

 if(
  !Number.isFinite(price)||
  !Number.isFinite(previousClose)||
  previousClose<=0
 ){
  throw Error("Live quote या पिछला बंद भाव उपलब्ध नहीं");
 }

 // Difference from same quote metadata
 const change=price-previousClose;

 const changePercent=
  (change/previousClose)*100;

 const dailyCandles=getCandles(dailyResult);
 const weeklyCandles=getCandles(weeklyResult);
 const monthlyCandles=getCandles(monthlyResult);

 if(
  dailyCandles.length<35||
  weeklyCandles.length<35||
  monthlyCandles.length<20
 ){
  throw Error("पर्याप्त ऐतिहासिक डेटा नहीं");
 }

 const daily=calculateIndicators(dailyCandles);
 const weekly=calculateIndicators(weeklyCandles);
 const monthly=calculateIndicators(monthlyCandles);

 // Quote update timestamp
 const timestamp=meta.regularMarketTime;

 const time=timestamp
  ?new Date(timestamp*1000).toLocaleString("en-IN")
  :"समय उपलब्ध नहीं";

 return {
  price,
  previousClose,
  change,
  changePercent,
  daily,
  weekly,
  monthly,
  time,
  currency:meta.currency||"INR",
  market:meta.fullExchangeName||meta.exchangeName||"Yahoo Finance"
 };
}

// Indicator table row
function indicatorRow(name,d){

 const rsi=d.rsi===null
  ?"N/A":d.rsi.toFixed(2);

 const macd=d.macd
  ?d.macd.histogram.toFixed(2):"N/A";

 const stoch=d.stochastic===null
  ?"N/A":d.stochastic.toFixed(2);

 const upper=d.bb
  ?fmt(d.bb.upper):"N/A";

 const lower=d.bb
  ?fmt(d.bb.lower):"N/A";

 return `
 <tr>
  <td>${name}</td>
  <td>${rsi}</td>
  <td>${macd}</td>
  <td>${stoch}</td>
  <td>${upper}</td>
  <td>${lower}</td>
 </tr>`;
}

// Card
function makeCard(name,d){

 const cls=d.change>=0?"green":"red";
 const sign=d.change>=0?"+":"";

 return `
 <div class="card">

  <h3>${name}</h3>

  <div class="price">
   ${d.currency==="INR"?"₹":d.currency}
   ${fmt(d.price)}
  </div>

  <div class="${cls}">
   Difference: ${sign}${fmt(d.change)}
   (${sign}${d.changePercent.toFixed(2)}%)
  </div>

  <div class="small">
   Previous Close: ${fmt(d.previousClose)}
  </div>

  <div class="small">
   Quote Time: ${d.time}
  </div>

  <div class="small">
   Source: ${d.market}
  </div>

  <div class="signal">
   ${signal(d.daily)}
  </div>

  <table>
   <tr>
    <th>Period</th>
    <th>RSI</th>
    <th>MACD</th>
    <th>Stoch</th>
    <th>BB Upper</th>
    <th>BB Lower</th>
   </tr>

   ${indicatorRow("Daily",d.daily)}
   ${indicatorRow("Weekly",d.weekly)}
   ${indicatorRow("Monthly",d.monthly)}

  </table>
 </div>`;
}

// Load dashboard
async function loadAll(){

 if(loading)return;
 loading=true;

 const board=$("dashboard");
 const status=$("status");

 board.innerHTML="";
 status.textContent="Intraday Yahoo डेटा लोड हो रहा है...";

 let success=0;
 let failed=0;
 let next=0;

 async function worker(){

  while(true){

   const index=next++;

   if(index>=stocks.length)return;

   const [name,symbol]=stocks[index];

   try{

    const data=await fetchStock(symbol);

    board.innerHTML+=makeCard(name,data);
    success++;

   }catch(e){

    failed++;

    board.innerHTML+=`
    <div class="card">
     <h3>${name}</h3>
     <div class="red">डेटा उपलब्ध नहीं</div>
     <div class="small">${e.message}</div>
    </div>`;
   }

   status.textContent=
    `जाँच ${success+failed}/${stocks.length} | सफल ${success} | असफल ${failed}`;
  }
 }

 try{

  await Promise.all([
   worker(),
   worker(),
   worker()
  ]);

  status.textContent=
   `सफल: ${success} | डेटा उपलब्ध नहीं: ${failed} | अपडेट: ${new Date().toLocaleTimeString("en-IN")}`;

 }finally{
  loading=false;
 }
}

// First load
loadAll();

// Refresh every 1 minute
setInterval(loadAll,60000);

</script>
</body>
</html>
