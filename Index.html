
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trade Pro</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#17243a;padding:20px;text-align:center}
h1{color:#00e0a4}
.container{padding:15px}
.card{background:#1d2b42;padding:18px;margin:12px 0;border-radius:12px}
.value{font-size:25px;color:#00e0a4}
button{background:#00c995;border:0;padding:12px 20px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>AI TRADE PRO</h1>
<p>Smart Stock Market Analysis</p>
</header>
<div class="container">
<div class="card">
<h3>Market Dashboard</h3>
<p>NIFTY 50</p>
<div class="value" id="nifty">Loading...</div>
<p id="status">Demo Dashboard</p>
</div>
<div class="card">
<h3>Technical Indicators</h3>
<p>RSI: <b>--</b></p>
<p>MACD: <b>--</b></p>
<p>STOCHASTIC: <b>--</b></p>
</div>
<div class="card">
<h3>Trading Signal</h3>
<div class="value">WAIT</div>
<p>Live data API not connected</p>
</div>
<div class="card">
<h3>Chart</h3>
<p>Chart integration pending</p>
</div>
</div>
</body>
</html>
